<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vite + React</title>
  <style>
    /* Full screen background image */
    body {
   
  margin: 0;
  padding: 0;
  min-height: 100vh;
  background-image: url('/fotor-ai-2025052741326.jpg');
  background-size: 100% auto;
  background-position: top;
  background-repeat: no-repeat;
  background-color: #f0f0f0; /* fallback if image doesn't cover whole page */
  overflow-y: auto;
}


    
    
    /* Apply transparency to the content area */
    #root {
      position: relative;
      z-index: 2;
    }
    
    /* Semi-transparent overlay */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.1); /* Reduced opacity for visibility */
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="overlay"></div>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
